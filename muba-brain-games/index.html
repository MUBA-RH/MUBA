<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>MUBA Brain Games</title>
<style>
:root{color-scheme:dark;--p:#a855f7;--bg:#09090d;--card:#15151c;--line:#2b2b38}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#2b1545 0,#09090d 38%);color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:24px;margin:0}.muted{color:#aaa;font-size:13px}.pill{border:1px solid #3a3150;background:#18131f;border-radius:999px;padding:8px 11px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.card,button{border:1px solid var(--line);background:linear-gradient(145deg,#181820,#101015);color:#fff;border-radius:16px;font:inherit}.card{padding:12px;text-align:left;min-height:118px;position:relative;overflow:hidden}.card b{display:block;font-size:16px;margin-top:7px}.card .num{color:#c084fc;font-weight:800}.thumb{height:52px;border-radius:11px;background:#21172d center 27%/cover no-repeat;filter:saturate(1.05)}button{cursor:pointer;padding:12px}.hidden{display:none!important}.play{margin-top:14px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.gamebox{position:relative;overflow:hidden;min-height:420px;border:1px solid #32263e;border-radius:20px;background:#11131a}.scene{position:absolute;inset:0}.muba{position:absolute;width:74px;height:74px;border-radius:50%;background:url('../daily-story-worker/muba_daily_story_master_reference.png') center 25%/235% auto no-repeat;border:2px solid rgba(255,255,255,.18);box-shadow:0 8px 24px #0008;z-index:4}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:9;pointer-events:none}.hud span{background:#08080bbb;border:1px solid #ffffff18;border-radius:999px;padding:7px 10px;font-size:13px}.tap{position:absolute;inset:auto 12px 12px;z-index:8;text-align:center}.tap button{background:#7c3aed;border-color:#a855f7;width:100%;font-weight:800}.obj{position:absolute;border-radius:10px}.grid{display:grid;gap:5px;padding:62px 12px 72px;height:100%}.cell{display:grid;place-items:center;background:#20212a;border:1px solid #343645;border-radius:8px;min-height:42px;font-weight:800}.wordrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.wordrow input{text-transform:uppercase;text-align:center;font-size:20px;padding:12px;border-radius:10px;border:1px solid #444;background:#171820;color:white}.center{position:absolute;inset:55px 12px 70px;display:grid;place-items:center;text-align:center}.big{font-size:44px}.board8{display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,420px);aspect-ratio:1}.sq{display:grid;place-items:center;font-size:26px}.light{background:#d6b98c}.dark{background:#6b4935}.footer{margin:18px 4px;color:#777;font-size:12px;text-align:center}
</style></head><body><main>
<div class="top"><div class="brand"><h1>🎮 MUBA BRAIN GAMES</h1><div class="muted">14 games · Same MUBA. Different universe.</div></div><div class="pill" id="best">XP 0</div></div>
<section id="menu" class="menu"></section>
<section id="play" class="play hidden"><div class="bar"><button id="back">← Games</button><b id="title"></b><button id="restart">↻</button></div><div id="gamebox" class="gamebox"></div></section>
<div class="footer">MUBA identity uses the locked master reference. Progress is stored on this device.</div>
</main><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const REF="../daily-story-worker/muba_daily_story_master_reference.png";
const games=[
["cross","MUBA CROSS","Arcade · Endless"],["fly","MUBA FLY","Arcade · Skill"],["race","MUBA RACE 3D","Racing"],["tower","MUBA TOWER","Stack · Timing"],
["rope","MUBA ROPE","Physics · Timing"],["circuit","MUBA CIRCUIT","Logic"],["laser","MUBA LASER","Reflection"],["jump","MUBA JUMP","Platform"],
["gravity","MUBA GRAVITY","Physics"],["football","MUBA FOOTBALL","Sports"],["hoops","MUBA HOOPS","Sports"],["chess","MUBA CHESS","Board"],
["merge","MUBA MERGE","Casual"],["word","MUBA WORD","Word · Quiz"]];
let xp=+(localStorage.mubaGameXP||0),current=null,cleanup=()=>{};const menu=document.querySelector("#menu"),play=document.querySelector("#play"),box=document.querySelector("#gamebox");
function updateXP(n=0){xp+=n;localStorage.mubaGameXP=xp;document.querySelector("#best").textContent="XP "+xp}
updateXP();
games.forEach((g,i)=>{let b=document.createElement("button");b.className="card";b.innerHTML='<div class="thumb" style="background-image:url('+REF+')"></div><span class="num">'+String(i+1).padStart(2,"0")+'</span><b>'+g[1]+'</b><span class="muted">'+g[2]+'</span>';b.onclick=()=>open(g);menu.appendChild(b)});
function open(g){cleanup();current=g;menu.classList.add("hidden");play.classList.remove("hidden");document.querySelector("#title").textContent=g[1];render(g[0]);tg?.HapticFeedback?.impactOccurred("light")}
document.querySelector("#back").onclick=()=>{cleanup();play.classList.add("hidden");menu.classList.remove("hidden")};document.querySelector("#restart").onclick=()=>current&&render(current[0]);
function shell(bg="linear-gradient(#73c8ff,#dff5ff)"){box.innerHTML='<div class="scene" style="background:'+bg+'"><div class="hud"><span id="score">Score 0</span><span id="state">PLAY</span></div></div>';return box.firstChild}
function hero(s,x=25,y=300){let m=document.createElement("div");m.className="muba";m.style.left=x+"px";m.style.top=y+"px";s.appendChild(m);return m}
function score(v){let e=document.querySelector("#score");if(e)e.textContent="Score "+v}
function end(msg,pts=5){let e=document.querySelector("#state");if(e)e.textContent=msg;updateXP(pts);tg?.HapticFeedback?.notificationOccurred(msg==="WIN"?"success":"error")}
function button(s,label,fn){let d=document.createElement("div");d.className="tap";d.innerHTML="<button>"+label+"</button>";d.firstChild.onclick=fn;s.appendChild(d)}
function dodge(type){let s=shell(type==="race"?"linear-gradient(#342052,#12131a)":"linear-gradient(#6ec7ff,#d8f1ff)"),m=hero(s,box.clientWidth/2-37,330),sc=0,dead=false,lane=1,obs=[],timer;
function setLane(n){lane=Math.max(0,Math.min(2,n));m.style.left=(box.clientWidth*(.18+.32*lane)-37)+"px"}setLane(1);
button(s,"◀ MOVE ▶",()=>{if(dead)return;setLane((lane+1)%3)});
timer=setInterval(()=>{if(dead)return;sc++;score(sc);if(sc%14===0){let o=document.createElement("div");o.className="obj";o.style.cssText="width:58px;height:58px;background:"+(type==="race"?"#ef4444":"#22c55e")+";top:-60px;left:"+(box.clientWidth*(.18+.32*Math.floor(Math.random()*3))-29)+"px";s.appendChild(o);obs.push(o)}obs.forEach(o=>{o.style.top=(parseFloat(o.style.top)+7)+"px";let a=o.getBoundingClientRect(),b=m.getBoundingClientRect();if(a.bottom>b.top&&a.top<b.bottom&&a.left<b.right&&a.right>b.left){dead=true;end("CRASH",Math.floor(sc/20));clearInterval(timer)}})},50);cleanup=()=>clearInterval(timer)}
function fly(){let s=shell("linear-gradient(#5fc8ff,#eefbff)"),m=hero(s,45,190),vy=0,sc=0,dead=false,pipes=[],t=setInterval(()=>{if(dead)return;vy+=.55;m.style.top=(parseFloat(m.style.top)+vy)+"px";if(parseFloat(m.style.top)>345||parseFloat(m.style.top)<0){dead=true;end("OUT",sc);clearInterval(t)}pipes.forEach(p=>{p.style.left=(parseFloat(p.style.left)-5)+"px"});sc++;score(Math.floor(sc/20));if(sc%45===0){let gap=100+Math.random()*140,p=document.createElement("div");p.className="obj";p.style.cssText="right:-55px;left:"+(box.clientWidth+10)+"px;top:0;width:45px;height:"+gap+"px;background:#22c55e";s.appendChild(p);pipes.push(p)}},40);button(s,"TAP TO FLY",()=>{vy=-7;tg?.HapticFeedback?.impactOccurred("light")});cleanup=()=>clearInterval(t)}
function timing(kind){let s=shell("linear-gradient(#ffcf75,#7c3aed)"),sc=0,dir=1,x=10,w=100,t,done=false,m=hero(s,box.clientWidth/2-37,280),bar=document.createElement("div");bar.className="obj";bar.style.cssText="top:180px;left:10px;width:100px;height:28px;background:#fff";s.appendChild(bar);
t=setInterval(()=>{x+=dir*6;if(x<5||x>box.clientWidth-w-5)dir*=-1;bar.style.left=x+"px"},35);button(s,kind==="tower"?"DROP BLOCK":"CUT ROPE",()=>{if(done)return;let center=x+w/2,target=box.clientWidth/2;if(Math.abs(center-target)<55){sc++;score(sc);w=Math.max(42,w-5);bar.style.width=w+"px";if(sc>=8){done=true;clearInterval(t);end("WIN",20)}}else{done=true;clearInterval(t);end("MISS",sc)}});cleanup=()=>clearInterval(t)}
function circuit(){let s=shell("linear-gradient(#111827,#052e2b)"),rot=[0,1,2,3,0,1,2,3,0],moves=0;let g=document.createElement("div");g.className="grid";g.style.gridTemplateColumns="repeat(3,1fr)";g.style.paddingTop="90px";rot.forEach((r,i)=>{let c=document.createElement("button");c.className="cell";c.textContent="└";c.style.fontSize="40px";c.style.transform="rotate("+(r*90)+"deg)";c.onclick=()=>{rot[i]=(rot[i]+1)%4;c.style.transform="rotate("+(rot[i]*90)+"deg)";moves++;score(moves);if(rot.every(v=>v===0))end("WIN",20)};g.appendChild(c)});s.appendChild(g);cleanup=()=>{}}
function laser(){let s=shell("linear-gradient(#160b23,#09090d)"),angle=0,beam=document.createElement("div");beam.className="obj";beam.style.cssText="left:35px;top:220px;height:4px;width:75%;background:#ff2d55;transform-origin:left center";s.appendChild(beam);let target=document.createElement("div");target.className="obj";target.style.cssText="right:28px;top:95px;width:42px;height:42px;border-radius:50%;background:#facc15";s.appendChild(target);button(s,"ROTATE LASER",()=>{angle-=15;beam.style.transform="rotate("+angle+"deg)";score(Math.abs(angle));if(angle<=-30&&angle>=-45)end("HIT",15)});cleanup=()=>{}}
function jump(gravity=false){let s=shell("linear-gradient(#7dd3fc,#312e81)"),m=hero(s,40,315),x=40,y=315,vy=-9,sc=0,g=.5,t,flip=1;t=setInterval(()=>{vy+=g*flip;y+=vy;if(y>320){y=320;vy=-9;sc++;score(sc)}if(y<40){y=40;vy=9}x=(x+2)%Math.max(80,box.clientWidth-75);m.style.left=x+"px";m.style.top=y+"px"},30);button(s,gravity?"FLIP GRAVITY":"BOOST JUMP",()=>{if(gravity)flip*=-1;else vy=-12});cleanup=()=>clearInterval(t)}
function targetGame(type){let s=shell("linear-gradient(#0f5132,#16324f)"),m=hero(s,20,315),shots=0,hits=0,target=document.createElement("div");target.className="obj";target.style.cssText="right:25px;top:100px;width:85px;height:85px;border:8px solid #fff;border-radius:"+(type==="hoops"?"50%":"12px");s.appendChild(target);button(s,type==="hoops"?"SHOOT HOOP":"KICK BALL",()=>{shots++;let ok=Math.random()>.38;if(ok){hits++;target.animate([{transform:"scale(1)"},{transform:"scale(1.18)"},{transform:"scale(1)"}],{duration:300});tg?.HapticFeedback?.notificationOccurred("success")}score(hits);document.querySelector("#state").textContent=hits+"/"+shots;if(shots===10)end(hits>=6?"WIN":"TRY AGAIN",hits*2)});cleanup=()=>{}}
function chess(){let s=shell("#211a18"),b=document.createElement("div");b.className="center";let bd=document.createElement("div");bd.className="board8";let pieces=["♜","♞","♝","♛","♚","♝","♞","♜",..."♟".repeat(8),...Array(32).fill(""),..."♙".repeat(8),"♖","♘","♗","♕","♔","♗","♘","♖"],sel=null,moves=0;pieces.forEach((p,i)=>{let q=document.createElement("button");q.className="sq "+(((Math.floor(i/8)+i)%2)?"dark":"light");q.textContent=p;q.onclick=()=>{if(sel===null&&p){sel=i;q.style.outline="3px solid #a855f7"}else if(sel!==null){pieces[i]=pieces[sel];pieces[sel]="";moves++;score(moves);chess()}};bd.appendChild(q)});b.appendChild(bd);s.appendChild(b);document.querySelector("#state").textContent="Free board";cleanup=()=>{}}
function merge(){let s=shell("linear-gradient(#3b0764,#111827)"),level=1,sc=0,area=document.createElement("div");area.className="center";let faces=[];function spawn(){let f=document.createElement("button");f.className="muba";f.style.position="relative";f.style.width=(54+level*3)+"px";f.style.height=(54+level*3)+"px";f.style.margin="5px";f.dataset.l=level;f.onclick=()=>{let same=faces.find(x=>x!==f&&x.dataset.l===f.dataset.l);if(same){same.remove();f.dataset.l=+f.dataset.l+1;f.style.width=(54+f.dataset.l*3)+"px";f.style.height=f.style.width;sc+=+f.dataset.l*10;score(sc);faces=faces.filter(x=>x!==same);if(+f.dataset.l>=6)end("MAX MUBA",25)}};faces.push(f);area.appendChild(f)}for(let i=0;i<8;i++)spawn();s.appendChild(area);button(s,"ADD MUBA",spawn);cleanup=()=>{}}
function word(){let s=shell("linear-gradient(#172554,#111827)"),words=["MEME","MUBA","LIVE","PLAY","GAME"],answer=words[new Date().getDate()%words.length],tries=0;let c=document.createElement("div");c.className="center";c.innerHTML='<div><div class="big">MUBA WORD</div><p class="muted">Guess the 4-letter word</p><div class="wordrow"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"></div><p id="hint"></p></div>';s.appendChild(c);let ins=[...c.querySelectorAll("input")];ins.forEach((x,i)=>x.oninput=()=>{x.value=x.value.toUpperCase();if(x.value&&ins[i+1])ins[i+1].focus()});button(s,"CHECK WORD",()=>{let v=ins.map(x=>x.value).join("");if(v.length<4)return;tries++;score(tries);if(v===answer){end("WIN",20);c.querySelector("#hint").textContent="Correct: "+answer}else{c.querySelector("#hint").textContent=[...v].map((ch,i)=>answer[i]===ch?"🟩":answer.includes(ch)?"🟨":"⬛").join("")}});cleanup=()=>{}}
function render(id){cleanup();if(id==="cross")dodge("cross");else if(id==="fly")fly();else if(id==="race")dodge("race");else if(id==="tower"||id==="rope")timing(id);else if(id==="circuit")circuit();else if(id==="laser")laser();else if(id==="jump")jump(false);else if(id==="gravity")jump(true);else if(id==="football"||id==="hoops")targetGame(id);else if(id==="chess")chess();else if(id==="merge")merge();else if(id==="word")word()}
</script></body></html>
