<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>MUBA Brain Games</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f4f4f4;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:520px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#999}.menu,.panel{display:grid;gap:12px}.card,button{border:1px solid #2c2c31;background:#151518;color:#fff;border-radius:16px;padding:16px;font:inherit}.card{text-align:left}.card b{display:block;font-size:20px;margin-bottom:4px}button{cursor:pointer}.back{padding:10px 14px}.hidden{display:none!important}.stats{display:flex;justify-content:space-between;margin:12px 0}.grid{display:grid;gap:7px;touch-action:manipulation}.memory{grid-template-columns:repeat(4,1fr)}.memory button{aspect-ratio:1;padding:0;font-size:30px}.mines{grid-template-columns:repeat(8,1fr)}.mines button{aspect-ratio:1;padding:0;border-radius:8px;font-size:15px}.game2048{grid-template-columns:repeat(4,1fr);background:#1b1b1f;padding:8px;border-radius:14px}.tile{aspect-ratio:1;display:grid;place-items:center;background:#29292f;border-radius:10px;font-weight:800;font-size:22px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.controls button{padding:12px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}h1{margin-bottom:4px}h2{margin:8px 0}
</style></head><body><main>
<div class="top"><div><h1>MUBA BRAIN GAMES</h1><div class="muted">Memory · Mines · 2048</div></div><button id="back" class="back hidden">←</button></div>
<section id="menu" class="menu" style="margin-top:24px">
<button class="card" data-game="memory"><b>🧠 MUBA MEMORY</b><span class="muted">Find all matching pairs.</span></button>
<button class="card" data-game="mines"><b>💣 MUBA MINES</b><span class="muted">Clear the field without hitting a mine.</span></button>
<button class="card" data-game="2048"><b>🔢 MUBA 2048</b><span class="muted">Merge tiles and reach 2048.</span></button>
</section>
<section id="play" class="panel hidden"><h2 id="title"></h2><div class="stats"><span id="status"></span><button id="reset" style="padding:8px 12px">Restart</button></div><div id="board"></div><div id="controls" class="controls hidden"><button class="up" data-d="up">↑</button><button class="left" data-d="left">←</button><button class="down" data-d="down">↓</button><button class="right" data-d="right">→</button></div></section>
</main><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const menu=document.querySelector('#menu'),play=document.querySelector('#play'),board=document.querySelector('#board'),statusEl=document.querySelector('#status'),title=document.querySelector('#title'),back=document.querySelector('#back'),controls=document.querySelector('#controls');
let current='', resetFn=()=>{};
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGame(b.dataset.game));
back.onclick=()=>{play.classList.add('hidden');menu.classList.remove('hidden');back.classList.add('hidden');controls.classList.add('hidden')};
document.querySelector('#reset').onclick=()=>resetFn();
function openGame(g){current=g;menu.classList.add('hidden');play.classList.remove('hidden');back.classList.remove('hidden'); if(g==='memory') memory(); if(g==='mines') mines(); if(g==='2048') game2048()}
function memory(){title.textContent='🧠 MUBA MEMORY';controls.classList.add('hidden');let vals=['M','U','B','A','★','◆','●','▲'];let cards=[...vals,...vals].sort(()=>Math.random()-.5),open=[],matched=0,moves=0;board.className='grid memory';
function draw(){board.innerHTML='';cards.forEach((v,i)=>{let b=document.createElement('button');b.textContent=open.includes(i)||b.dataset.done?v:'?'; if(open.includes(i))b.textContent=v;b.onclick=()=>flip(i,b);board.appendChild(b)});statusEl.textContent='Moves: '+moves+' · Pairs: '+matched+'/8'}
function flip(i,b){if(open.includes(i)||open.length===2||b.dataset.done)return;open.push(i);draw();if(open.length===2){moves++;let[a,c]=open,bs=board.children;if(cards[a]===cards[c]){matched++;setTimeout(()=>{cards[a]='✓'+cards[a];cards[c]='✓'+cards[c];open=[];if(matched===8)statusEl.textContent='Completed in '+moves+' moves';draw()},250)}else setTimeout(()=>{open=[];draw()},650)}}resetFn=memory;draw()}
function mines(){title.textContent='💣 MUBA MINES';controls.classList.add('hidden');const n=8,total=64,mcount=10;let ms=new Set();while(ms.size<mcount)ms.add(Math.floor(Math.random()*total));let revealed=new Set(),dead=false;board.className='grid mines';
function near(i){let r=Math.floor(i/n),c=i%n,x=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=r+dr,cc=c+dc,j=rr*n+cc;if(rr>=0&&rr<n&&cc>=0&&cc<n&&ms.has(j))x++}return x}
function reveal(i){if(dead||revealed.has(i))return;if(ms.has(i)){dead=true;draw();statusEl.textContent='Mine hit — restart';return}revealed.add(i);if(near(i)===0){let r=Math.floor(i/n),c=i%n;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<n&&cc>=0&&cc<n)reveal(rr*n+cc)}}draw();if(revealed.size===total-mcount){dead=true;statusEl.textContent='Field cleared!'}}
function draw(){board.innerHTML='';for(let i=0;i<total;i++){let b=document.createElement('button');if(dead&&ms.has(i))b.textContent='✹';else if(revealed.has(i))b.textContent=near(i)||'';else b.textContent='·';b.onclick=()=>reveal(i);board.appendChild(b)}if(!dead)statusEl.textContent='Safe: '+revealed.size+'/'+(total-mcount)}resetFn=mines;draw()}
function game2048(){title.textContent='🔢 MUBA 2048';controls.classList.remove('hidden');let a=Array(16).fill(0),score=0;board.className='grid game2048';function add(){let e=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)a[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function line(x){let z=x.filter(Boolean);for(let i=0;i<z.length-1;i++)if(z[i]===z[i+1]){z[i]*=2;score+=z[i];z.splice(i+1,1)}return [...z,...Array(4-z.length).fill(0)]}
function move(d){let old=a.join();let out=Array(16).fill(0);for(let k=0;k<4;k++){let idx=[];for(let j=0;j<4;j++)idx.push((d==='left'||d==='right')?k*4+j:j*4+k);let v=idx.map(i=>a[i]);if(d==='right'||d==='down')v.reverse();v=line(v);if(d==='right'||d==='down')v.reverse();idx.forEach((i,j)=>out[i]=v[j])}a=out;if(a.join()!==old)add();draw()}
function draw(){board.innerHTML='';a.forEach(v=>{let d=document.createElement('div');d.className='tile';d.textContent=v||'';board.appendChild(d)});statusEl.textContent='Score: '+score+(a.includes(2048)?' · 2048!':'')}controls.querySelectorAll('button').forEach(b=>b.onclick=()=>move(b.dataset.d));let sx,sy;board.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};board.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))};resetFn=game2048;add();add();draw()}
</script></body></html>
