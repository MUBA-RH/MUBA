<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>MUBA Brain Games</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09090d;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{background:radial-gradient(circle at 50% -15%,#38214c 0,#09090d 35%)}main{max-width:720px;margin:auto;padding:16px}.head{display:flex;align-items:center;gap:12px}.logo{width:62px;height:62px;border-radius:50%;background:url('../daily-story-worker/muba_daily_story_master_reference.png') center 23%/240% auto no-repeat;border:2px solid #8b5cf6;box-shadow:0 0 24px #8b5cf655}.head h1{font-size:22px;margin:0}.sub{font-size:13px;color:#aaa;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:18px}.card{appearance:none;text-align:left;border:1px solid #2d2935;border-radius:18px;background:linear-gradient(145deg,#19171e,#111015);color:white;padding:12px;min-height:112px;position:relative;overflow:hidden}.card:active{transform:scale(.98)}.card .n{font-size:11px;color:#b993e9;font-weight:800}.card b{display:block;margin-top:8px;font-size:16px}.card small{color:#999}.mark{position:absolute;right:-9px;bottom:-9px;width:70px;height:70px;border-radius:50%;background:url('../daily-story-worker/muba_daily_story_master_reference.png') center 23%/245% auto no-repeat;opacity:.72}.player{position:fixed;inset:0;background:#07070a;z-index:30;display:none;flex-direction:column}.player.open{display:flex}.bar{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:7px max(10px,env(safe-area-inset-right)) 7px max(10px,env(safe-area-inset-left));background:#111116;border-bottom:1px solid #292631}.back{border:1px solid #393442;background:#1b1920;color:#fff;border-radius:12px;padding:9px 12px;font-weight:700}.barlogo{width:38px;height:38px;border-radius:50%;background:url('../daily-story-worker/muba_daily_story_master_reference.png') center 23%/245% auto no-repeat;border:1px solid #8b5cf6}.title{min-width:0;flex:1}.title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{font-size:11px;color:#999}.framewrap{position:relative;flex:1;min-height:0;background:#000}.framewrap iframe{border:0;width:100%;height:100%;display:block;background:#000}.badge{position:absolute;z-index:4;right:9px;top:9px;display:flex;align-items:center;gap:6px;background:#0a0a0dcc;border:1px solid #ffffff22;border-radius:999px;padding:5px 8px;pointer-events:none;font-size:10px;font-weight:800}.badge i{display:block;width:25px;height:25px;border-radius:50%;background:url('../daily-story-worker/muba_daily_story_master_reference.png') center 23%/245% auto no-repeat}.notice{font-size:11px;color:#777;text-align:center;margin:18px 4px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#09090d;z-index:2;color:#aaa}.loading.hide{display:none}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}} 
</style></head><body><main><div class="head"><div class="logo"></div><div><h1>MUBA BRAIN GAMES</h1><div class="sub">14 original games · MUBA game hub</div></div></div><section class="grid" id="grid"></section><div class="notice">Original gameplay is preserved. MUBA branding is applied to the game hub and player shell without altering game mechanics.</div></main>
<section class="player" id="player"><div class="bar"><button class="back" id="back">← GAMES</button><div class="barlogo"></div><div class="title"><b id="pt"></b><span>MUBA BRAIN GAMES</span></div></div><div class="framewrap"><div class="loading" id="loading">Loading original game…</div><iframe id="frame" allow="autoplay; fullscreen; gamepad" referrerpolicy="no-referrer"></iframe><div class="badge"><i></i>MUBA</div></div></section>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const ROOT="https://sausi-7.github.io/games/";
const games=[
["MUBA CROSS","Arcade · Endless","games/arcade/crossy-road/index.html"],
["MUBA FLY","Arcade · Skill","games/arcade/flappy/index.html"],
["MUBA RACE 3D","Racing · 3D","games/racing/car-race/index.html"],
["MUBA TOWER 3D","3D · Timing","games/3d/stack-tower/index.html"],
["MUBA ROPE","Puzzle · Physics","games/puzzle/cut-rope/index.html"],
["MUBA CIRCUIT","Puzzle · Logic","games/puzzle/circuit-bulb/index.html"],
["MUBA LASER","Puzzle · Action","games/puzzle/laser-bounce/index.html"],
["MUBA JUMP","Platformer","games/platformer/doodle-jump/index.html"],
["MUBA GRAVITY","Platformer · Physics","games/platformer/antigravity/index.html"],
["MUBA FOOTBALL","Sports","games/sports/football/index.html"],
["MUBA HOOPS","Sports","games/sports/basketball/index.html"],
["MUBA CHESS","Board · Strategy","games/board/chess/index.html"],
["MUBA MERGE","Casual · Merge","games/casual/fruit-merge/inex.html"],
["MUBA WORD","Word · Quiz","games/word-quiz/wordle/index.html"]
];
const grid=document.querySelector("#grid"),player=document.querySelector("#player"),frame=document.querySelector("#frame"),loading=document.querySelector("#loading"),pt=document.querySelector("#pt");
games.forEach((g,i)=>{const b=document.createElement("button");b.className="card";b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span><b>'+g[0]+'</b><small>'+g[1]+'</small><i class="mark"></i>';b.onclick=()=>openGame(g);grid.appendChild(b)});
function openGame(g){pt.textContent=g[0];loading.classList.remove("hide");player.classList.add("open");frame.src=ROOT+g[2];tg?.HapticFeedback?.impactOccurred("light")}
frame.addEventListener("load",()=>loading.classList.add("hide"));
document.querySelector("#back").onclick=()=>{frame.src="about:blank";player.classList.remove("open");tg?.HapticFeedback?.impactOccurred("light")};
</script></body></html>
