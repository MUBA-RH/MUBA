<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>MUBA RUN</title>
<style>*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#08080d}body{font-family:system-ui,-apple-system,sans-serif;touch-action:none}.hud{position:fixed;z-index:8;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff;pointer-events:none;text-shadow:0 2px 8px #000;font-weight:800}.hint{position:fixed;z-index:8;left:50%;bottom:calc(15px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#ffffffbb;background:#09090dbb;border:1px solid #ffffff22;border-radius:999px;padding:8px 13px;font-size:12px;pointer-events:none;white-space:nowrap}.over{position:fixed;z-index:12;inset:0;display:none;place-items:center;background:#050508bb;color:#fff;text-align:center;padding:25px}.over.show{display:grid}.panel{width:min(360px,90vw);padding:24px;border:1px solid #ffffff25;border-radius:24px;background:#111117}.panel h1{margin:0 0 8px}.panel button{width:100%;border:0;border-radius:14px;padding:13px;font-weight:900;background:#fff;color:#111;margin-top:16px}</style>
</head><body><div id="game"></div><div class="hud"><span>MUBA RUN</span><span id="score">0</span></div><div class="hint">Swipe ↑ jump · ↓ slide · ← → lanes</div><div class="over" id="over"><div class="panel"><h1>RUN OVER</h1><div id="result"></div><button id="again">RUN AGAIN</button></div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();}
let score=0,best=Number(localStorage.getItem('mubaRunBest')||0),speed=360,alive=true,player,obstacles,ground,scoreEl=document.getElementById('score'),startX=0,startY=0,lanes=[];
class Run extends Phaser.Scene{
create(){
 const w=this.scale.width,h=this.scale.height;lanes=[w*.27,w*.5,w*.73];
 this.cameras.main.setBackgroundColor('#12101b');
 for(let i=0;i<24;i++){const x=Math.random()*w,y=Math.random()*h*.7;this.add.circle(x,y,Math.random()*1.8+.4,0xffffff,Math.random()*.45+.08)}
 this.add.rectangle(w/2,h*.78,w,h*.44,0x17131d); for(const x of lanes)this.add.rectangle(x,h*.78,3,h*.44,0xffffff,.08);
 ground=this.add.rectangle(w/2,h-34,w,68,0x211a20);this.physics.add.existing(ground,true);
 const g=this.add.graphics();g.fillStyle(0xb97b52);g.fillCircle(34,29,24);g.fillStyle(0x211d22);g.fillRoundedRect(12,0,44,18,8);g.fillStyle(0xffffff);g.fillCircle(25,25,8);g.fillCircle(43,25,8);g.fillStyle(0x4a2d23);g.fillCircle(25,25,3);g.fillCircle(43,25,3);g.fillStyle(0xf18b91);g.fillEllipse(34,44,13,8);g.fillStyle(0x0d0d10);g.fillRoundedRect(14,50,40,30,9);g.generateTexture('muba-runner',68,84);g.destroy();
 player=this.physics.add.sprite(lanes[1],h-105,'muba-runner');player.setCollideWorldBounds(true).body.setSize(46,76).setOffset(11,6);player.lane=1;player.sliding=false;
 obstacles=this.physics.add.group();this.physics.add.collider(player,ground);this.physics.add.overlap(player,obstacles,()=>endRun(),null,this);
 this.time.addEvent({delay:920,loop:true,callback:()=>spawn(this)});this.input.keyboard&&this.input.keyboard.on('keydown',e=>control(e.key));
 this.input.on('pointerdown',p=>{startX=p.x;startY=p.y});this.input.on('pointerup',p=>{const dx=p.x-startX,dy=p.y-startY;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25)control(dx>0?'ArrowRight':'ArrowLeft');else if(Math.abs(dy)>25)control(dy<0?'ArrowUp':'ArrowDown');});
}
update(_,delta){if(!alive)return;score+=delta*.012;speed=Math.min(720,360+score*.55);scoreEl.textContent=Math.floor(score);obstacles.children.iterate(o=>{if(o&&o.y>this.scale.height+80){o.destroy();score+=8}})}
}
function spawn(s){if(!alive)return;const lane=Phaser.Math.Between(0,2),x=lanes[lane],type=Math.random()<.3?'high':'block';const o=s.add.rectangle(x,-50,type==='high'?72:58,type==='high'?38:70,type==='high'?0xe7b64a:0x6d3f87);s.physics.add.existing(o);o.body.setVelocityY(speed);obstacles.add(o)}
function control(k){if(!alive)return;if(k==='ArrowLeft'||k==='a'){player.lane=Math.max(0,player.lane-1);player.scene.tweens.add({targets:player,x:lanes[player.lane],duration:100})}if(k==='ArrowRight'||k==='d'){player.lane=Math.min(2,player.lane+1);player.scene.tweens.add({targets:player,x:lanes[player.lane],duration:100})}if((k==='ArrowUp'||k==='w'||k===' ')&&player.body.blocked.down)player.setVelocityY(-610);if((k==='ArrowDown'||k==='s')&&!player.sliding){player.sliding=true;player.setScale(1,.58);player.body.setSize(46,42).setOffset(11,39);setTimeout(()=>{if(player){player.setScale(1);player.body.setSize(46,76).setOffset(11,6);player.sliding=false}},520)}tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light')}
function endRun(){if(!alive)return;alive=false;player.setTint(0xff7777);best=Math.max(best,Math.floor(score));localStorage.setItem('mubaRunBest',best);document.getElementById('result').textContent='Score '+Math.floor(score)+' · Best '+best;document.getElementById('over').classList.add('show');tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('error')}
document.getElementById('again').onclick=()=>location.reload();
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:480,height:800,backgroundColor:'#12101b',physics:{default:'arcade',arcade:{gravity:{y:1450},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:Run});
</script></body></html>
