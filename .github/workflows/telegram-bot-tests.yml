name: Telegram Bot Tests
on:
  pull_request:
    paths:
      - 'telegram-bot/**'
      - '.github/workflows/telegram-bot-tests.yml'
  push:
    branches: [main]
    paths:
      - 'telegram-bot/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile production runtime
        run: python -m py_compile bot_mention.py muba_studio.py muba_gallery.py muba_history.py muba_updates.py muba_daily.py muba_brain.py
      - name: Run layered brain tests
        run: python -m unittest discover -s tests -v
