name: MUBA V3 Android Cloud Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/v3-final-apk-build
      - 'fix/v3-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MUBA_V3_UPSTREAM_COMMIT: 9552e5541e1274b9557c9832b204dbfcaf44b3dc
      MUBA_OFFICIAL_DIALOG_ID: ${{ secrets.MUBA_OFFICIAL_DIALOG_ID }}
      TELEGRAM_API_ID: ${{ secrets.MUBA_V3_TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.MUBA_V3_TELEGRAM_API_HASH }}
    steps:
      - name: Checkout MUBA
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate required private inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in MUBA_OFFICIAL_DIALOG_ID TELEGRAM_API_ID TELEGRAM_API_HASH; do
            test -n "${!name:-}" || { echo "::error::Missing required GitHub Actions secret: $name"; exit 2; }
            echo "::add-mask::${!name}"
          done

      - name: Stage pinned Telegram source and MUBA helpers
        shell: bash
        env:
          MUBA_V3_SKIP_HOST_SDK_CHECK: '1'
        run: |
          chmod +x android-v3/stage_supported_build.sh
          android-v3/stage_supported_build.sh "$RUNNER_TEMP/Telegram"

      - name: Apply MUBA V3 composer hook and private API inputs
        shell: bash
        run: |
          chmod +x android-v3/apply_v3_patch.sh
          android-v3/apply_v3_patch.sh "$RUNNER_TEMP/Telegram"

      - name: Build with Telegram official Docker toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram"
          docker build -t muba-v3-telegram .
          docker run --rm -v "$RUNNER_TEMP/Telegram:/home/source" muba-v3-telegram

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/v3-apk"
          find "$RUNNER_TEMP/Telegram/TMessagesProj/build/outputs/apk" -type f -name '*.apk' -print -exec cp {} "$GITHUB_WORKSPACE/v3-apk/" \;
          test -n "$(find "$GITHUB_WORKSPACE/v3-apk" -type f -name '*.apk' -print -quit)"

      - name: Upload MUBA V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: MUBA-V3-Android-APK
          path: v3-apk/*.apk
          if-no-files-found: error
          retention-days: 7
