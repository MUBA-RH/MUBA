name: MUBA V3 Android Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MUBA_V3_UPSTREAM_COMMIT: 9552e5541e1274b9557c9832b204dbfcaf44b3dc
      MUBA_OFFICIAL_DIALOG_ID: ${{ secrets.MUBA_OFFICIAL_DIALOG_ID }}
      TELEGRAM_API_ID: ${{ secrets.MUBA_V3_TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.MUBA_V3_TELEGRAM_API_HASH }}
    steps:
      - name: Checkout MUBA
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36 and NDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Validate required private inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in MUBA_OFFICIAL_DIALOG_ID TELEGRAM_API_ID TELEGRAM_API_HASH; do
            test -n "${!name:-}" || { echo "::error::Missing required GitHub Actions secret: $name"; exit 2; }
            echo "::add-mask::${!name}"
          done

      - name: Stage pinned Telegram source and MUBA helpers
        shell: bash
        run: |
          chmod +x android-v3/stage_supported_build.sh
          android-v3/stage_supported_build.sh "$RUNNER_TEMP/Telegram"

      - name: Stop before unsafe/incomplete APK publication
        shell: bash
        run: |
          echo "::notice::Cloud host, SDK/NDK, pinned Telegram source and V3 helpers are ready."
          echo "::notice::APK publication remains fail-closed until the composer hook and private upstream BuildVars/signing/Firebase inputs are integrated."
          exit 0
